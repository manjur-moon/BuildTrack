components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Better Auth session cookie (name may have __Secure- prefix or customized name when
        configured). Not a JS-readable token.
  schemas:
    Id:
      type: string
      minLength: 8
      maxLength: 128
      description: Opaque server generated ID, currently a String cuid; never a user-chosen identifier
    Money:
      type: string
      pattern: ^(?:0|[1-9][0-9]{0,15})(?:\.[0-9]{1,2})?$
      description: BDT fixed-point decimal string, up to 16 integer and 2 fractional digits; nonnegative;
        business rules may require >0
    PositiveMoney:
      allOf:
      - $ref: '#/components/schemas/Money'
      - type: string
        pattern: '[1-9]'
    SignedMoney:
      type: string
      pattern: ^-?(?:0|[1-9][0-9]{0,15})(?:\.[0-9]{1,2})?$
    Quantity:
      type: string
      pattern: ^(?:0|[1-9][0-9]{0,14})(?:\.[0-9]{1,3})?$
      description: Fixed-point positive quantity, up to 15 integer and 3 fractional digits; business logic
        enforces >0
    PositiveQuantity:
      allOf:
      - $ref: '#/components/schemas/Quantity'
      - type: string
        pattern: '[1-9]'
    Percent:
      type: number
      minimum: 0
      maximum: 100
      multipleOf: 0.01
    CalendarDate:
      type: string
      format: date
      description: YYYY-MM-DD; project calendar local date, not converted to UTC midnight
    Timestamp:
      type: string
      format: date-time
      description: UTC ISO 8601 timestamp, e.g. 2026-11-24T10:00:00.000Z
    Role: *id026
    ProjectStatus: *id027
    SiteStatus: *id028
    TaskStatus: *id029
    TaskPriority: *id030
    MilestoneStatus: *id031
    ContractorStatus: *id032
    ExpenseStatus: *id033
    MaterialRequestStatus: *id034
    MaterialUnit: *id035
    StockMovementType:
      type: string
      enum:
      - RECEIPT
      - ISSUE
      - RETURN
      - ADJUSTMENT_IN
      - ADJUSTMENT_OUT
    PageMeta:
      type: object
      additionalProperties: false
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        sort:
          type: string
      required:
      - page
      - pageSize
      - totalItems
      - totalPages
      - sort
    Error:
