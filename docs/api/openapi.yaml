openapi: 3.1.0
info:
  title: BuildTrack REST API
  version: 1.0.0-draft
  description: 'Step 3 proposed design contract; endpoints are NOT implemented. Better Auth native endpoints
    under /api/auth/* are intentionally not duplicated. All business API data is selected from active
    membership and server trusted organization context. Project, task, finance and inventory DTOs correspond
    to Step 2 provisional Prisma design. Request-level / resource-level authorization remains mandatory
    even with cookie authentication. All errors have one standardized error object. '
servers:
- url: http://localhost:3000
  description: Proposed development server; not deployed
tags:
- name: System
  description: Sanitized health
- name: Identity
  description: Active membership and users
- name: Projects
  description: Projects/sites/milestones
- name: Tasks
  description: Task workflows and dependencies
- name: Contractors
  description: Contractor entities and assignments
- name: Finance
  description: Budgets and posted expenses
- name: Materials
  description: Inventory and material workflows
- name: Progress
  description: Daily site reports
- name: Attachments
  description: Private file lifecycle
- name: Notifications
  description: In-app notifications
- name: Analytics
  description: Role-aware metrics
security:
- sessionCookie: []
paths:
  /api/v1/health:
    get:
      tags:
      - System
      summary: Liveness check
      operationId: GET__health
      description: Sanitized liveness only; no dependency details
      x-buildtrack-roles: []
      x-buildtrack-resource-scope: PUBLIC
      x-buildtrack-priority: P0
      security: []
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  data:
                    $ref: '#/components/schemas/HealthResponse'
                required:
                - data
        '429':
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/me/context:
